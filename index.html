<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yulduzlar Osmoniga Xush Kelibsiz</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #172554 0%, #090d16 58%, #04060b 100%);
      color: #f8fafc;
      overflow-x: hidden;
    }

    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 16px 64px;
    }

    .top-panel {
      max-width: 540px;
      margin: 0 auto 24px;
      background: rgba(10, 15, 29, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      padding: 24px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fde047;
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #bae6fd, #fde047);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 0.92rem;
      color: #cbd5e1;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      font-size: 0.95rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
    }

    button {
      padding: 12px 18px;
      font-size: 0.94rem;
      font-weight: 700;
      color: #090d16;
      background: linear-gradient(135deg, #fde047, #38bdf8);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
      transition: transform 0.12s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(253, 224, 71, 0.38);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .sky-field {
      position: relative;
      min-height: 360px;
      border-radius: 24px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(7, 11, 22, 0.45);
      backdrop-filter: blur(4px);
      overflow: hidden;
      padding: 24px;
      margin-bottom: 24px;
    }

    .sky-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      color: #94a3b8;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .sky-header strong {
      color: #fde047;
    }

    .stars-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      align-items: center;
      padding: 12px 0;
    }

    .star-node {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(253, 224, 71, 0.22);
      cursor: default;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
      animation: floatStar 4s ease-in-out infinite;
    }

    .star-node:hover {
      transform: translateY(-5px) scale(1.06);
      background: rgba(30, 41, 59, 0.85);
      border-color: #fde047;
      box-shadow: 0 0 24px rgba(253, 224, 71, 0.35);
    }

    .star-glow {
      font-size: 1.7rem;
      line-height: 1;
      color: #fde047;
      text-shadow: 0 0 12px rgba(253, 224, 71, 0.9), 0 0 24px rgba(56, 189, 248, 0.6);
      animation: twinkle 2.4s ease-in-out infinite;
    }

    .star-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f8fafc;
      word-break: break-word;
      max-width: 180px;
      text-align: center;
    }

    .star-time {
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .empty-sky {
      text-align: center;
      color: #94a3b8;
      padding: 64px 16px;
      font-size: 0.95rem;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.75; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes floatStar {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>

  <div class="page">
    <section class="top-panel">
      <div class="badge">✦ Tungi Osmon</div>
      <h1>Yulduzlar osmoniga xush kelibsiz</h1>
      <p class="subtitle">Ismingizni yozing — osmonda yangi yulduz porlasin.</p>

      <div class="form-row">
        <input id="name" placeholder="Ismingizni kiriting..." maxlength="100" onkeydown="if(event.key==='Enter') add()">
        <button id="addBtn" onclick="add()">Yulduz qo‘shish</button>
      </div>
    </section>

    <section class="sky-field">
      <div class="sky-header">
        <span>Osmondagi yulduzlar</span>
        <span>Jami: <strong id="count">0</strong></span>
      </div>
      <div class="stars-wrap" id="list"></div>
    </section>
  </div>

<script>
const API = "/.netlify/functions/api";
const SYMBOLS = ["✦", "★", "✧", "✪", "✵"];

function extractRows(data) {
  if (Array.isArray(data)) return data;
  if (Array.isArray(data?.notes)) return data.notes;
  if (Array.isArray(data?.rows)) return data.rows;
  return [];
}

async function load() {
  const wrap = document.getElementById("list");
  const countEl = document.getElementById("count");
  try {
    const res = await fetch(API);
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data?.error || `HTTP ${res.status}`);
    }

    const rows = extractRows(data);
    wrap.innerHTML = "";
    countEl.textContent = rows.length;

    if (!rows.length) {
      wrap.innerHTML = '<div class="empty-sky">Osmon hali bo‘sh. Birinchi yulduzni siz yoqing!</div>';
      return;
    }

    rows.forEach((r, i) => {
      const node = document.createElement("div");
      node.className = "star-node";
      node.style.animationDelay = `${(i % 7) * -0.55}s`;

      const glow = document.createElement("div");
      glow.className = "star-glow";
      glow.textContent = SYMBOLS[i % SYMBOLS.length];
      glow.style.animationDelay = `${(i % 5) * -0.4}s`;

      const title = document.createElement("span");
      title.className = "star-title";
      title.textContent = r.name;

      const time = document.createElement("span");
      time.className = "star-time";
      time.textContent = r.created_at ? new Date(r.created_at).toLocaleString() : "";

      node.appendChild(glow);
      node.appendChild(title);
      if (time.textContent) node.appendChild(time);
      wrap.appendChild(node);
    });
  } catch (err) {
    wrap.innerHTML = `<div class="empty-sky">Xatolik: ${err.message}</div>`;
  }
}

async function add() {
  const input = document.getElementById("name");
  const name = input.value.trim();
  if (!name) {
    input.focus();
    return;
  }

  const btn = document.getElementById("addBtn");
  btn.disabled = true;

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data?.error || `HTTP ${res.status}`);
    }
    input.value = "";
    await load();
  } catch (err) {
    alert("Saqlashda xatolik: " + err.message);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
let stars = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = Array.from({ length: 160 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.3,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.02 + 0.005
  }));
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of stars) {
    s.phase += s.speed;
    const alpha = 0.2 + Math.abs(Math.sin(s.phase)) * 0.8;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(render);
}

window.addEventListener("resize", resize);
resize();
render();
load();
</script>
</body>
</html>
